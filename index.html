<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SRT 字幕翻译器</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1b2939;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;padding:14px}main{max-width:850px;margin:auto}h1{font-size:23px;margin:8px 0}p{line-height:1.6;color:#526477}.card{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 14px #14253b0a}h2{font-size:17px;margin:0 0 12px}.row{display:flex;flex-wrap:wrap;gap:9px}button,.filelabel{border:0;border-radius:10px;padding:13px 15px;min-height:46px;background:#175cba;color:white;font-size:16px;cursor:pointer;text-align:center}button.secondary{background:#e7effa;color:#174a85}button:disabled{opacity:.48;cursor:not-allowed}.filelabel{display:block;width:100%;background:#1761c4;font-weight:600}input[type=file]{position:absolute;opacity:0;width:1px;height:1px}progress{width:100%;height:16px;accent-color:#1771d0}.meta{font-size:14px;color:#526477;margin:9px 0;overflow-wrap:anywhere}.row button{flex:1 1 145px}#preview{white-space:pre-wrap;overflow-wrap:anywhere;max-height:330px;overflow:auto;background:#f5f8fc;border-radius:8px;padding:12px;font-size:14px;line-height:1.7}#log{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;color:#526477;max-height:150px;overflow:auto}.hint{font-size:13px;color:#64748b}.ok{color:#14623d}.bad{color:#a63131}select{font-size:16px;min-height:44px;border:1px solid #b7c5d6;border-radius:9px;padding:8px;background:white;max-width:100%}label.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}</style></head><body><main>
<h1>中英 SRT 字幕翻译器</h1><p>支持上传中文、英文、中英双语 SRT。翻译缺少的语言，保留原时间轴。<strong>不内置任何字幕。</strong></p>
<section class="card"><h2>① 上传字幕</h2><label class="filelabel" for="file">📁 上传字幕（.srt）</label><input type="file" id="file" accept=".srt,.txt,text/plain,application/x-subrip,application/octet-stream"><div id="filename" class="meta">尚未上传字幕</div><div id="total" class="meta">共 0 条</div><div id="importError" class="meta bad" role="alert"></div></section>
<section class="card"><h2>② 翻译字幕</h2><div class="row"><label class="inline">翻译服务 <select id="service"><option value="google">Google 公共接口（优先）</option><option value="mymemory">MyMemory（备用）</option></select></label></div><p class="hint">翻译需要联网；公共接口可能限流或拒绝访问。失败时可切换服务继续。每条成功后自动保存进度。</p><div class="row"><button id="start" disabled>开始／继续翻译</button><button id="stop" class="secondary" disabled>暂停翻译</button></div><progress id="bar" max="100" value="0"></progress><div id="count" class="meta">已完成 0 / 0 条</div><div id="status" class="meta" role="status">请先上传字幕</div><details><summary>查看运行日志</summary><div id="log"></div></details></section>
<section class="card"><h2>③ 导出字幕</h2><div class="row"><button id="downloadBoth" class="secondary" disabled>导出中英字幕</button><button id="downloadZh" class="secondary" disabled>导出中文</button><button id="downloadEn" class="secondary" disabled>导出英文</button></div><p class="hint">双语默认中文在上、英文在下。未翻译完也能导出已有内容；缺少目标语言的条目不会被伪装成译文。</p></section>
<section class="card"><h2>字幕预览（前 5 条）</h2><div id="preview">上传字幕后显示</div><div class="row" style="margin-top:12px"><button id="reset" class="secondary" disabled>清空当前文件的翻译进度</button></div></section>
</main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let rows=[],filename='',key='',translations={},running=false,stopping=false,logLines=[];
function log(s){logLines.unshift(new Date().toLocaleTimeString()+' '+s);logLines=logLines.slice(0,35);$('log').textContent=logLines.join('\n')}
function status(s,bad=false){$('status').textContent=s;$('status').className='meta '+(bad?'bad':'')}
function normalizeTime(s){return s.replace(/\.(\d{3})/g,',$1').trim()}
function hasZh(s){return /[\u3400-\u9fff]/.test(s)}function hasEn(s){return /[A-Za-z]/.test(s)}
function parseSrt(raw){raw=raw.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');const chunks=raw.split(/\n\s*\n+/),out=[];const timeRe=/(\d{1,2}:\d{2}:\d{2}[,.]\d{1,3})\s*-->\s*(\d{1,2}:\d{2}:\d{2}[,.]\d{1,3})(?:\s+.*)?/;for(const chunk of chunks){const lines=chunk.split('\n');let idx=lines.findIndex(x=>timeRe.test(x));if(idx<0)continue;let m=lines[idx].match(timeRe);const fmt=t=>{const [h,mi,se,ms]=t.replace('.',',').split(/[:,]/);return [h.padStart(2,'0'),mi,se].join(':')+','+ms.padEnd(3,'0')};let zh=[],en=[];for(let line of lines.slice(idx+1)){line=line.replace(/<[^>]*>/g,'').replace(/\{\[^}]*\}/g,'').trim();if(!line)continue;if(hasZh(line)&&hasEn(line)){let z=line.match(/[\u3400-\u9fff][\u3400-\u9fff\s，。！？、；：“”‘’（）—…·0-9]*/g)||[];let e=line.replace(/[\u3400-\u9fff]+/g,' ').replace(/\s+/g,' ').trim();if(z.length)zh.push(z.join(' ').trim());if(e)en.push(e)}else if(hasZh(line))zh.push(line);else if(hasEn(line))en.push(line);else if(zh.length)zh.push(line);else if(en.length)en.push(line)}if(zh.length||en.length)out.push({time:fmt(m[1])+' --> '+fmt(m[2]),zh:zh.join(' ').trim(),en:en.join(' ').trim()})}return out}
function keyFor(name,rs){let s=name+'|'+rs.length+'|'+(rs[0]?.time||'')+'|'+(rs.at(-1)?.time||'');let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return 'srt_bilingual_v5_'+(h>>>0).toString(16)}
function save(){try{localStorage.setItem(key,JSON.stringify(translations))}catch(e){log('保存进度失败：'+e.message)}}
function get(i){return {zh:rows[i].zh||translations[i]?.zh||'',en:rows[i].en||translations[i]?.en||''}}
function refresh(){let done=0;for(let i=0;i<rows.length;i++){let x=get(i);if(x.zh&&x.en)done++}let pct=rows.length?done/rows.length*100:0;$('count').textContent=`双语完成 ${done} / ${rows.length} 条（${pct.toFixed(1)}%）`;$('bar').value=pct;$('total').textContent=`共 ${rows.length} 条；中文 ${rows.filter((r,i)=>!!get(i).zh).length} 条；英文 ${rows.filter((r,i)=>!!get(i).en).length} 条`;$('preview').textContent=rows.length?rows.slice(0,5).map((r,i)=>`${i+1}\n${r.time}\n${get(i).zh||'（待翻译中文）'}\n${get(i).en||'（待翻译英文）'}`).join('\n\n'):'上传字幕后显示';for(let id of ['start','downloadBoth','downloadZh','downloadEn','reset'])$(id).disabled=!rows.length||running;$('stop').disabled=!running}
async function readFile(file){const buf=await file.arrayBuffer();let text=new TextDecoder('utf-8',{fatal:false}).decode(buf);const replacement=(text.match(/\uFFFD/g)||[]).length;if(replacement>5){try{const gb=new TextDecoder('gb18030').decode(buf);if((gb.match(/\uFFFD/g)||[]).length<replacement)text=gb}catch{}}return text}
$('file').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;if(running){status('请先暂停翻译，再上传新文件',true);e.target.value='';return}try{const parsed=parseSrt(await readFile(f));if(!parsed.length)throw Error('未找到 SRT 时间轴（例如 00:00:01,000 --> 00:00:03,000）');rows=parsed;filename=f.name.replace(/\.(srt|txt)$/i,'');key=keyFor(filename,rows);try{translations=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch{translations={}}$('filename').textContent='当前文件：'+f.name;$('importError').textContent='';status('上传成功，可以开始翻译或直接导出已有字幕');log(`成功上传 ${rows.length} 条`);refresh()}catch(err){$('importError').textContent='上传失败：'+err.message;log(err.message)}finally{e.target.value=''}});
function clean(s){const d=document.createElement('textarea');d.innerHTML=s;return d.value.replace(/<[^>]+>/g,'').trim()}
async function googleTranslate(s,from,to){const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl='+encodeURIComponent(from)+'&tl='+encodeURIComponent(to)+'&dt=t&q='+encodeURIComponent(s);const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('Google HTTP '+r.status);const j=await r.json();const t=(j[0]||[]).map(x=>x?.[0]||'').join('').trim();if(!t)throw Error('Google 没有返回译文');return t}
async function memoryTranslate(s,from,to){if(s.length>450)throw Error('本条太长（超过450字符），MyMemory 不支持，请切换 Google');const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(s)+'&langpair='+encodeURIComponent(from+'|'+to);const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('MyMemory HTTP '+r.status);const j=await r.json();if(Number(j.responseStatus)!==200)throw Error('MyMemory 限制：'+(j.responseDetails||j.responseStatus));let t=clean(j.responseData?.translatedText||'');if(!t)throw Error('MyMemory 没有返回译文');return t}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
$('start').onclick=async()=>{if(running||!rows.length)return;running=true;stopping=false;refresh();status('正在翻译…');let success=0,failed=0;for(let i=0;i<rows.length&&!stopping;i++){const x=get(i);if(x.zh&&x.en)continue;const from=x.en?'en':'zh-CN',to=x.en?'zh-CN':'en',src=x.en||x.zh;if(!src)continue;try{const t=$('service').value==='google'?await googleTranslate(src,from,to):await memoryTranslate(src,from,to);if(!t||t.toLowerCase()===src.toLowerCase())throw Error('返回内容与原文相同，疑似接口未翻译');translations[i]={...(translations[i]||{}),[x.en?'zh':'en']:t};success++;save();if(success%3===0){refresh();log('已翻译 '+success+' 条，本次第 '+(i+1)+' 条')}failed=0}catch(e){failed++;log(`第 ${i+1} 条失败：${e.message}`);status(`第 ${i+1} 条翻译失败：${e.message}。可切换翻译服务后继续。`,true);break}await sleep($('service').value==='google'?250:650)}save();running=false;refresh();if(stopping)status('已暂停，进度已保存');else if(!failed)status('翻译结束，已保存进度。可导出字幕');};
$('stop').onclick=()=>{stopping=true;status('正在暂停，等待当前请求结束…')};
function exportSrt(mode){if(!rows.length)return;const blocks=[];let missing=0;rows.forEach((r,i)=>{const x=get(i);let content=mode==='en'?(x.en?[x.en]:[]):mode==='zh'?(x.zh?[x.zh]:[]):x.zh&&x.en?[x.zh,x.en]:[];if(!content.length){missing++;return}blocks.push(`${blocks.length+1}\n${r.time}\n${content.join('\n')}`)});if(!blocks.length){alert('没有可导出的目标语言字幕，请先翻译');return}if(missing&&!confirm(`有 ${missing} 条缺少所选语言，将只导出 ${blocks.length} 条。继续吗？`))return;const suffix=mode==='en'?'英文':mode==='zh'?'中文':'中英双语';const blob=new Blob(['\uFEFF'+blocks.join('\n\n')+'\n'],{type:'application/x-subrip;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename+'_'+suffix+'.srt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);log('已导出 '+suffix+' '+blocks.length+' 条')}
$('downloadBoth').onclick=()=>exportSrt('both');$('downloadZh').onclick=()=>exportSrt('zh');$('downloadEn').onclick=()=>exportSrt('en');$('reset').onclick=()=>{if(running||!rows.length)return;if(!confirm('清空此文件的自动翻译进度？原始字幕不会删除。'))return;translations={};save();refresh();status('已清空当前翻译进度')};refresh();
})();</script></body></html>
