t and then all my foundation in virtue was no other than a total ignorance of vice"}, {"time": "00:03:34,640 --> 00:03:43,200", "en": "and the shy timidity general to our sex in the tender stage of life when objects alarm or frighten more by their novelty"}, {"time": "00:03:43,200 --> 00:03:53,040", "en": "than anything else but then this is a fear too often cured at the expense of innocence when miss by degrees begins no longer to look on a"}, {"time": "00:03:53,040 --> 00:03:58,720", "en": "man as a creature of prey that will eat her my poor mother had divided her time so"}, {"time": "00:03:58,720 --> 00:04:06,640", "en": "entirely between her scholars and her little domestic cares that she had spared very little to my instruction"}, {"time": "00:04:06,640 --> 00:04:13,280", "en": "having from her own innocence from all ill no hint or thought of guarding me against any"}, {"time": "00:04:13,280 --> 00:04:21,120", "en": "i was now entering on my fifteenth year when the worst of ills befell me in the loss of my fond tender parents"}, {"time": "00:04:21,120 --> 00:04:29,280", "en": "who were both carried off by the smallpox within a few days of each other my father dying first and thereby"}, {"time": "00:04:29,280 --> 00:04:38,080", "en": "hastening the death of my mother so that i was now left an unhappy friendless orphan for my father's coming to settle there"}, {"time": "00:04:38,080 --> 00:04:48,320", "en": "was accidental he being originally a kentishman that cruel distemper which had proved so fatal to them had indeed seized me"}, {"time": "00:04:48,320 --> 00:04:59,759", "en": "but with such mild and favorable symptoms that i was presently out of danger and what i then did not know the value of was entirely unmarked"}, {"time": "00:04:59,759 --> 00:05:07,280", "en": "i skip over here an account of the natural grief and affliction which i felt on this melancholy occasion"}, {"time": "00:05:07,280 --> 00:05:15,280", "en": "a little time in the goodness of that age dissipated too soon my reflections on that irreparable loss"}, {"time": "00:05:15,280 --> 00:05:25,039", "en": "but nothing contributed more to reconcile me to it than the notions that were immediately put into my head of going to london and looking out for a"}, {"time": "00:05:25,039 --> 00:05:33,120", "en": "service in which i was promised all assistance and advice from one esther davis a young woman that had been down"}, {"time": "00:05:33,120 --> 00:05:40,080", "en": "to see her friends and who after the stay of a few days was to return to her place"}, {"time": "00:05:40,080 --> 00:05:47,280", "en": "as i had now nobody left alive in the village who had concern enough about what should become of me to start any"}, {"time": "00:05:47,280 --> 00:05:55,360", "en": "objections to this scheme and the woman who took care of me after my parents death rather encouraged me to pursue it"}, {"time": "00:05:55,360 --> 00:06:01,759", "en": "i soon came to a resolution of making this launch into the wide world by repairing to london"}, {"time": "00:06:01,759 --> 00:06:12,720", "en": "in order to seek my fortune a phrase which by the by has ruined more adventurers of both sexes from the country than ever it made or advanced"}, {"time": "00:06:12,720 --> 00:06:22,479", "en": "nor did esther davis a little comfort and inspired me to venture with her by peaking my childish curiosity with the fine sights that were to be seen in"}, {"time": "00:06:22,479 --> 00:06:30,639", "en": "london the tombs the lions the king the royal family the fine plays in operas and in short"}, {"time": "00:06:30,639 --> 00:06:38,000", "en": "all the diversions which fell within her sphere of life to come at the detail of all which perfectly turned"}, {"time": "00:06:38,000 --> 00:06:45,840", "en": "the little head of me nor can i remember without laughing the innocent admiration not without a spice"}, {"time": "00:06:45,840 --> 00:06:54,720", "en": "of envy with which we poor girls whose church going clothes did not rise above dallas shifts and stuffed gowns beheld"}, {"time": "00:06:54,720 --> 00:07:03,919", "en": "esther's scoured satin gowns caps bordered with an inch of lace toddery ribbons and shoes be laced with silver"}, {"time": "00:07:03,919 --> 00:07:14,000", "en": "all which we imagined grew in london and entered for a great deal into my determination of trying to come in for my share of them"}, {"time": "00:07:14,000 --> 00:07:22,560", "en": "the idea however of having the company of a townswoman with her was the trivial and all the motives that engaged esther"}, {"time": "00:07:22,560 --> 00:07:30,560", "en": "to take charge of me during my journey to town where she told me after her manner and style as how several maids"}, {"time": "00:07:30,560 --> 00:07:37,199", "en": "out of the country had made themselves and all their kin forever that by preserving their virtue"}, {"time": "00:07:37,199 --> 00:07:46,240", "en": "some had taken so with their masters that they had married them and kept them coaches and lived vastly grand and happy"}, {"time": "00:07:46,240 --> 00:07:54,560", "en": "and some may have came to be duchesses luck was all and why not i as well as another"}, {"time": "00:07:54,560 --> 00:08:04,960", "en": "with other almanacs to this purpose which set me a tiptoe to begin this promising journey and to leave a place which though my native one contained no"}, {"time": "00:08:04,960 --> 00:08:15,360", "en": "relations that i had reasoned to regret and was grown insupportable to me from the change of the tenderest usage into a cold air of charity with which i was"}, {"time": "00:08:15,360 --> 00:08:25,039", "en": "entertained even at the only friend's house that i had the least expectation of care and protection from she was however so just to me as to"}, {"time": "00:08:25,039 --> 00:08:35,680", "en": "manage the turning into money of the little matters that remained to me after the deaths and burial charges were allowed for and at my departure put my whole fortune"}, {"time": "00:08:35,680 --> 00:08:42,800", "en": "into my hands which consisted of a very slender wardrobe packed up in a very portable box"}, {"time": "00:08:42,800 --> 00:08:54,560", "en": "and eight guineas with 17 shillings in silver stowed up in a spring pouch which was a greater treasure than ever i had yet seen together and which i could not"}, {"time": "00:08:54,560 --> 00:09:02,959", "en": "conceive there was a possibility of running out and indeed i was so entirely taken up with the joy of seeing myself mistress"}, {"time": "00:09:02,959 --> 00:09:09,519", "en": "of such an immense sum that i gave very little attention to a world of good advice which was given me"}, {"time": "00:09:09,519 --> 00:09:22,320", "en": "with it places then being taken for esther and me in the chester wagon i pass over a very immaterial scene of leave-taking at which i dropped a few tears betwixt"}, {"time": "00:09:22,320 --> 00:09:32,880", "en": "grief and joy and for the same reasons of insignificance skip over all that happened to me on the road such as the wagoner's looking licorice on me"}, {"time": "00:09:32,880 --> 00:09:42,959", "en": "the schemes laid for me by some of the passengers which were defeated by the vigilance of my guardian esther who to do her justice took a motherly care of"}, {"time": "00:09:42,959 --> 00:09:53,360", "en": "me at the same time that she taxed me for her protection by making me bear all the traveling charges which i defrayed with the utmost cheerfulness and thought"}, {"time": "00:09:53,360 --> 00:10:06,000", "en": "myself much obliged to her into the bargain she took indeed great care that we were not overrated or imposed on as well as of managing as frugally as possible"}, {"time": "00:10:06,000 --> 00:10:13,040", "en": "expensiveness was not her vice it was pretty late in a summer evening when we reached the town in our slow"}, {"time": "00:10:13,040 --> 00:10:23,600", "en": "conveyance though drawn by six at length as we passed through the greatest streets that led to our inn the noise of the coaches the hurry the crowds of foot"}, {"time": "00:10:23,600 --> 00:10:31,040", "en": "passengers in short the new scenery of the shops and houses at once pleased and amazed me"}, {"time": "00:10:31,040 --> 00:10:41,440", "en": "but guess at my mortification and surprise when we came to the inn and our things were landed and delivered to us when my fellow traveler and protectress esther"}, {"time": "00:10:41,440 --> 00:10:50,560", "en": "davis who had used me with the utmost tenderness during the journey and prepared me by no preceding signs for the stunning blow i was to receive when"}, {"time": "00:10:50,560 --> 00:11:01,120", "en": "i say my only dependence and friend in this strange place all of a sudden assumed a strange and cool air towards me as if she dreaded my"}, {"time": "00:11:01,120 --> 00:11:07,519", "en": "becoming a burden to her instead then of proffering me the continuance of her assistance and good"}, {"time": "00:11:07,519 --> 00:11:18,880", "en": "offices which i relied upon and never more wanted she thought herself it seems abundantly acquitted of her engagements to me by having brought me safe to my journey's"}, {"time": "00:11:18,880 --> 00:11:30,160", "en": "end and seeing nothing in her procedure towards me but what was natural and in order began to embrace me by way of taking leave whilst i was so confounded"}, {"time": "00:11:30,160 --> 00:11:40,320", "en": "so struck that i had not spirit or sense enough so much as to mention my hopes or expectations from her experience and knowledge of the place she had brought"}, {"time": "00:11:40,320 --> 00:11:49,279", "en": "me to whilst i stood thus stupid and mute which she doubtless attributed to nothing more than a concern at parting"}, {"time": "00:11:49,279 --> 00:12:00,640", "en": "this idea procured me perhaps a slight alleviation of it in the following harangue that now we were got safe to london and that she was obliged to go to her place"}, {"time": "00:12:00,640 --> 00:12:08,639", "en": "she advised me by all means to get into one as soon as possible that i need not fear getting one there were more places"}, {"time": "00:12:08,639 --> 00:12:16,079", "en": "than parish churches that she advised me to go to an intelligence office that if she heard of anything staring"}, {"time": "00:12:16,079 --> 00:12:24,720", "en": "she would find me out and let me know that in the meantime i should take a private lodging and acquaint her where to send to me"}, {"time": "00:12:24,720 --> 00:12:31,600", "en": "that she wished me good luck and hoped i should always have the grace to keep myself honest and not bring a disgrace"}, {"time": "00:12:31,600 --> 00:12:39,519", "en": "on my parentage with this she took her leave of me and left me as it were on my own hands full"}, {"time": "00:12:39,519 --> 00:12:49,440", "en": "as lightly as i had been put into hers left thus alone absolutely destitute and friendless i began then to feel most"}, {"time": "00:12:49,440 --> 00:12:56,399", "en": "bitterly the severity of this separation the scene of which had passed in little room in the inn"}, {"time": "00:12:56,399 --> 00:13:07,279", "en": "and no sooner was her back turned but the affliction i felt at my helpless strange circumstances burst out into a flood of tears which infinitely relieved"}, {"time": "00:13:07,279 --> 00:13:16,000", "en": "the oppression of my heart though i still remained stupefied and most perfectly perplexed how to dispose of myself"}, {"time": "00:13:16,000 --> 00:13:24,480", "en": "one of the drawers coming in added yet more to my uncertainty by asking me in a short way if i called for anything"}, {"time": "00:13:24,480 --> 00:13:32,240", "en": "to which i replied innocently no but i wished him to tell me where i might get a lodging for that night"}, {"time": "00:13:32,240 --> 00:13:39,920", "en": "he said he would go and speak to his mistress who accordingly came and told me dryly without entering in the least"}, {"time": "00:13:39,920 --> 00:13:47,440", "en": "into the distress she saw me in that i might have a bed for a shilling in that as she supposed i had some friends in"}, {"time": "00:13:47,440 --> 00:13:54,800", "en": "town here i fetched a deep sigh in vain i might provide for myself in the morning"}, {"time": "00:13:54,800 --> 00:14:04,720", "en": "it is incredible what trifling constellations the human mind will seize in its greatest afflictions the assurance of nothing more than a bed to lie on that night"}, {"time": "00:14:04,720 --> 00:14:10,399", "en": "calmed my agonies and being ashamed to acquaint the mistress of the inn that i had no"}, {"time": "00:14:10,399 --> 00:14:20,240", "en": "friends to apply to in town i proposed to myself to proceed the very next morning to an intelligence office to which i was furnished with written"}, {"time": "00:14:20,240 --> 00:14:26,399", "en": "directions on the back of a ballad of esther's giving me there i counted on getting information"}, {"time": "00:14:26,399 --> 00:14:31,440", "en": "of any place that such a country girl as i might be fit for and where i could get"}, {"time": "00:14:31,440 --> 00:14:38,480", "en": "into any sort of being before my little stock should be consumed and as to a character esther had often"}, {"time": "00:14:38,480 --> 00:14:49,120", "en": "repeated to me that i might depend on her managing me one nor however affected i was at her leaving me thus did i entirely cease to rely on her as i began"}, {"time": "00:14:49,120 --> 00:14:58,240", "en": "to think good-naturedly that her procedure was all in course and that it was only my ignorance of life that had made me take it in the light i at first"}, {"time": "00:14:58,240 --> 00:15:06,560", "en": "did accordingly the next morning i dressed myself as clean and as neat as my rustic wardrobe would permit me and having left"}, {"time": "00:15:06,560 --> 00:15:16,720", "en": "my box with special recommendation with the landlady i ventured out by myself and without any more difficulty than can be supposed of a young country girl"}, {"time": "00:15:16,720 --> 00:15:22,399", "en": "barely 15 and to whom every sign or shop was a gazing trap i got to the wished"}, {"time": "00:15:22,399 --> 00:15:29,680", "en": "for intelligence office it was kept by an elderly woman who sat at the receipt of custom with a book"}, {"time": "00:15:29,680 --> 00:15:38,720", "en": "before her in great form and order and several scrolls made out of directions for places i made up then to this important"}, {"time": "00:15:38,720 --> 00:15:45,360", "en": "personage without lifting up my eyes or observing any of the people around me who were attending there on the same"}, {"time": "00:15:45,360 --> 00:15:55,839", "en": "errands as myself and dropping her curtsies 9 deep just made a shift to stammer out my business to her madam heard me out with all the gravity"}, {"time": "00:15:55,839 --> 00:16:04,240", "en": "and brow of a petty minister of state and seeing at one glance over my figure what i was made me no answer but to ask"}, {"time": "00:16:04,240 --> 00:16:14,959", "en": "me the preliminary shilling on receipt of which she told me places for women were exceedingly scarce especially as i seemed too slight built for hard work"}, {"time": "00:16:14,959 --> 00:16:19,279", "en": "but that she would look over her book and see what was to be done for me"}, {"time": "00:16:19,279 --> 00:16:27,199", "en": "desiring me to stay a little till she had dispatched some other customers on this i drew back a little most"}, {"time": "00:16:27,199 --> 00:16:38,079", "en": "heartily mortified declaration which carried with it a killing uncertainty that my circumstances could not well endure presently assuming more courage"}, {"time": "00:16:38,079 --> 00:16:43,920", "en": "and seeking some diversion from my uneasy thoughts i ventured to lift up my head a little"}, {"time": "00:16:43,920 --> 00:16: ch she used to fleece us all which charles indolently chose to bear with rather than take the trouble"}, {"time": "02:30:05,920 --> 02:30:16,240", "en": "of removing the difference of expense being scarce attended to by a young gentleman who had no idea of stint or even of economy and a raw country girl"}, {"time": "02:30:16,240 --> 02:30:23,280", "en": "who knew nothing of the matter here however under the wings of my sovereignly beloved did i flow the most"}, {"time": "02:30:23,280 --> 02:30:31,680", "en": "delicious hours of my life my child's i had and in him everything my fond heart could wish or desire"}, {"time": "02:30:31,680 --> 02:30:42,080", "en": "he carried me to plays operas masquerades and every diversion of a town all of which pleased me indeed but pleased me infinitely the more for his"}, {"time": "02:30:42,080 --> 02:30:50,720", "en": "being with me and explaining everything to me and enjoying perhaps the natural impressions of surprise and admiration"}, {"time": "02:30:50,720 --> 02:31:01,280", "en": "which such sights at the first never failed to excite in a country girl new to the delights of them but to me they sensibly proved the power and full"}, {"time": "02:31:01,280 --> 02:31:06,960", "en": "dominion of the sole passion of my heart over me a passion in which soul and body"}, {"time": "02:31:06,960 --> 02:31:16,240", "en": "were concentered and left me no room for any other relish of life but love as to the men i saw at those places"}, {"time": "02:31:16,240 --> 02:31:25,040", "en": "or at any other they suffered so much in the comparison my eyes made of them with my all perfect adonis that i had not the"}, {"time": "02:31:25,040 --> 02:31:32,960", "en": "infidelity even of one wandering thought to reproach myself with upon his account he was the universe to me"}, {"time": "02:31:32,960 --> 02:31:40,160", "en": "and all that was not him was nothing to me my love in fine was so excessive"}, {"time": "02:31:40,160 --> 02:31:48,560", "en": "th red into it i joined my own comments and asked him questions of explanation"}, {"time": "02:33:23,040 --> 02:33:30,800", "en": "my country accent and the rasticity of my gait manners and deportment began now sensibly to wear off"}, {"time": "02:33:30,800 --> 02:33:38,319", "en": "so quick was my observation and so efficacious my desire of growing every day worthier of his heart"}, {"time": "02:33:38,319 --> 02:33:45,439", "en": "as to money though he brought me constantly all he received it was with difficulty he even got me to give it"}, {"time": "02:33:45,439 --> 02:33:54,720", "en": "room in my bureau and what clothes i had he could prevail on me to accept of on no other foot than that of pleasing him by the greater"}, {"time": "02:33:54,720 --> 02:34:06,800", "en": "neatness in my dress beyond which i had no ambition i could have made a pleasure of the greatest toil and worked my fingers to the bone with joy to have supported him"}, {"time": "02:34:06,800 --> 02:34:14,000", "en": "guess then if i could harbor any idea of being burdensome to him and this disinterested turn in me was so"}, {"time": "02:34:14,000 --> 02:34:23,040", "en": "unaffected so much the dictate of my heart that charles could not but feel it and if he did not love me as i did him"}, {"time": "02:34:23,040 --> 02:34:33,280", "en": "which was a constant and only matter of sweet contention between us he managed so at least as to give me the satisfaction of believing it impossible"}, {"time": "02:34:33,280 --> 02:34:41,680", "en": "for a man to be more tender more true more faithful than he was our landlady mrs jones came frequently"}, {"time": "02:34:41,680 --> 02:34:49,359", "en": "up to my apartment from whence i never stirred on any pretext without charles nor was it long before she wormed out"}, {"time": "02:34:49,359 --> 02:34:56,560", "en": "without much art the secret of our having cheated the church of a ceremony and in course of the terms we lived"}, {"time": "02:34:56,560 --> 02:35:04,800", "en": "together upon a circumstance which far from displeased her considering the design she had upon me and which alas"}, {"time": "02:35:04,800 --> 02:35:12,080", "en": "she will too soon have room to carry into execution but in the meantime her own experience"}, {"time": "02:35:12,080 --> 02:35:23,280", "en": "of life let her see that any attempt however indirect or disguised to divert or break at least presently so strong a cement of hearts as ours was"}, {"time": "02:35:23,280 --> 02:35:32,240", "en": "could only end in losing two lodgers of whom she made very competent advantages if either of us came to smoke her commission"}, {"time": "02:35:32,240 --> 02:35:40,720", "en": "for a commission she had from one of her customers either to the botch or get me away from my keeper at any rate"}, {"time": "02:35:40,720 --> 02:35:48,640", "en": "but the barbarity of my fate soon saved her the task of disuniting us i had now been 11 months with this life"}, {"time": "02:35:48,640 --> 02:35:57,439", "en": "of my life which had passed in one continued rapid stream of delight but nothing so violent was ever made to last"}, {"time": "02:35:57,439 --> 02:36:06,000", "en": "i was about three months gone with child by him a circumstance which would have added to his tenderness had he ever left me room"}, {"time": "02:36:06,000 --> 02:36:13,280", "en": "to believe it could receive an addition when the mortal the unexpected blow of separation fell upon us"}, {"time": "02:36:13,280 --> 02:36:21,359", "en": "i shall gallop post over the particulars which i shudder yet to think of and cannot to this instant reconcile myself"}, {"time": "02:36:21,359 --> 02:36:30,240", "en": "how or by what means i could outlive it two life-long days had i lingered through without hearing from him"}, {"time": "02:36:30,240 --> 02:36:38,800", "en": "i who breathed who existed but in him and had never yet seen 24 hours pass without seeing or hearing from him"}, {"time": "02:36:38,800 --> 02:36:46,640", "en": "the third day my impatience was so strong my alarms had been so severe that i perfectly sickened with them"}, {"time": "02:36:46,640 --> 02:36:54,640", "en": "and being unable to support the shock longer i sunk upon the bed and ringing for mrs jones who had far from comforted"}, {"time": "02:36:54,640 --> 02:37:06,720", "en": "me under my anxieties she came up i had scarce breath and spirit enough to find words to beg of her if she would save my life to fall upon some means of"}, {"time": "02:37:06,720 --> 02:37:14,160", "en": "finding out instantly what was become of its only prop and comfort she pitied me in a way that rather"}, {"time": "02:37:14,160 --> 02:37:22,319", "en": "sharpened my affliction than suspended it and went out upon this commission for she had but to go to charles's house"}, {"time": "02:37:22,319 --> 02:37:33,439", "en": "who lived but an easy distance in one of the streets that run into covent garden there she went into a public house and from dance sent for a maidservant whose"}, {"time": "02:37:33,439 --> 02:37:40,319", "en": "name i had given her as the properist to inform her the maid readily came and is readily"}, {"time": "02:37:40,319 --> 02:37:50,960", "en": "when mrs jones inquired of her what was become of mr charles or whether he was gone out of town acquainted her with the disposal of her master son which the"}, {"time": "02:37:50,960 --> 02:38:01,280", "en": "very day after was no secret to the servants such sure measures had he taken for the most cruel punishment of his child for having more interest with his"}, {"time": "02:38:01,280 --> 02:38:09,680", "en": "grandmother than he had though he made use of a pretense plausible enough to get rid of him in this secret and abrupt manner for fear"}, {"time": "02:38:09,680 --> 02:38:16,479", "en": "her fondness should have interposed a bar to his leaving england and proceeding on a voyage he had concerted"}, {"time": "02:38:16,479 --> 02:38:27,359", "en": "for him which pretext was that it was indispensably necessary to secure a considerable inheritance that devolved to him by the death of a rich"}, {"time": "02:38:27,359 --> 02:38:34,080", "en": "merchant his own brother at one of the factories in the south seas of which he had lately received"}, {"time": "02:38:34,080 --> 02:38:41,120", "en": "advice together with a copy of the will in consequence of which resolution to send away his son"}, {"time": "02:38:41,120 --> 02:38:48,880", "en": "he had unknown to him made the necessary preparations for fitting him out struck a bargain with the captain of a ship"}, {"time": "02:38:48,880 --> 02:38:56,640", "en": "whose punctual execution of his orders he had secured by his interest with his principal owner and patron"}, {"time": "02:38:56,640 --> 02:39:04,080", "en": "and in short concerted his measures so secretly and effectually that whilst his son thought he was going down the river"}, {"time": "02:39:04,080 --> 02:39:10,560", "en": "for a few hours he was stopped on board of a ship debarred from writing and more strictly"}, {"time": "02:39:10,560 --> 02:39:18,800", "en": "watched than a state criminal thus was the idol of my soul torn from me enforced on a long voyage without"}, {"time": "02:39:18,800 --> 02:39:27,520", "en": "taking leave of one friend and receiving one line of comfort except a dry explanation and instructions from his father"}, {"time": "02:39:27,520 --> 02:39:36,240", "en": "how to proceed when he should arrive at his distant port in closing with all some letters of recommendation to a factory there"}, {"time": "02:39:36,240 --> 02:39:46,240", "en": "all these particulars i did not learn minutely till some time after the maid at the same time added that she was sure this usage of her sweet young"}, {"time": "02:39:46,240 --> 02:39:57,040", "en": "master would be the death of his grandmama as indeed it proved true for the old lady on hearing it did not survive the news a whole month and as"}, {"time": "02:39:57,040 --> 02:40:08,319", "en": "her fortune consisted in an annuity out of which she had laid up no reserves she left nothing worth mentioning to her so fatally envy darling but absolutely"}, {"time": "02:40:08,319 --> 02:40:19,359", "en": "refused to see his father before she died one mrs jones returned and i observed her looks they seemed so unconcerned and even near to pleased that i have"}, {"time": "02:40:19,359 --> 02:40:30,000", "en": "flattered myself she was going to set my tortured heart at ease by bringing me good news but this indeed was a cruel delusion of hope"}, {"time": "02:40:30,000 --> 02:40:37,920", "en": "the barbarian with all the coolness imaginable stabbed me to the heart in telling me succinctly that he was sent"}, {"time": "02:40:37,920 --> 02:40:45,600", "en": "away at least on a four years voyage here she stretched maliciously and that i could not expect in reason"}, {"time": "02:40:45,600 --> 02:40:53,200", "en": "ever to see him again and all this with such pregnant circumstances that i could not escape giving them"}, {"time": "02:40:53,200 --> 02:41:01,680", "en": "credit as they were indeed too true she hardly finished her report before i fainted away and after several"}, {"time": "02:41:01,680 --> 02:41:10,160", "en": "successive fits all the while wild and senseless i miscarried of the dear pledge of my charles's love"}, {"time": "02:41:10,160 --> 02:41:17,200", "en": "but the wretched never die when it is fittest they should die and women are hard lived to a proverb"}, {"time": "02:41:17,200 --> 02:41:24,640", "en": "the cruel and interested care taken to recover me saved an odious life which instead of the happiness and joys"}, {"time": "02:41:24,640 --> 02:41:35,040", "en": "it had overflowed in all of a sudden presented no view before me of anything but the depth of misery horror and the sharpest affliction"}, {"time": "02:41:35,040 --> 02:41:44,720", "en": "thus i lay six weeks in the struggles of youth and constitution against the friendly efforts of death which i constantly invoked to my relief and"}, {"time": "02:41:44,720 --> 02:41:51,200", "en": "deliverance but which proving too weak for my wish i recovered at length though into a state"}, {"time": "02:41:51,200 --> 02:41:59,840", "en": "of stupid faction and despair that threatened me with the loss of my senses and a mad house time however that great"}, {"time": "02:41:59,840 --> 02:42:07,200", "en": "comforter in ordinary began to assuage the violence of my sufferings and to numb my feeling of them"}, {"time": "02:42:07,200 --> 02:42:16,880", "en": "my health returned to me though i still retained an air of grief dejection and langur which taking off the readiness of my country complexion"}, {"time": "02:42:16,880 --> 02:42:28,160", "en": "rendered it rather more delicate and affecting the landlady had all this while officiously provided and taken care that i wanted for nothing and as soon as she"}, {"time": "02:42:28,160 --> 02:42:40,240", "en": "saw me retrieved into a condition of answering her purpose one day after we had dined together she congratulated me on my recovery the merit of which she took entirely to"}, {"time": "02:42:40,240 --> 02:42:50,960", "en": "herself and all this by way of introduction to a most terrible and scurvy epilogue you are now says she miss fanny"}, {"time": "02:42:50,960 --> 02:42:56,640", "en": "tolerably well and you are very welcome to stay in the lodgings as long as you please"}, {"time": "02:42:56,640 --> 02:43:02,560", "en": "you see i have asked you for nothing this long time but truly i have a call to make up a sum"}, {"time": "02:43:02,560 --> 02:43:11,520", "en": "of money which must be answered and with that presents me with a bill of arrears for rent diet apothecaries"}, {"time": "02:43:11,520 --> 02:43:23,920", "en": "charges nurse etc some total 23 pounds 17 and 6 pence towards discharging of which i had not in the world which she well knew"}, {"time": "02:43:23,920 --> 02:43:32,399", "en": "more than seven guineas left by chance of my dear charles's common stock with me at the same time she desired me to tell"}, {"time": "02:43:32,399 --> 02:43:37,600", "en": "her what course i would take for payment i burst into a flood of tears and told"}, {"time": "02:43:37,600 --> 02:43:46,479", "en": "her my condition adding that i would sell what few clothes i had and that for the rest i would pay her as soon as possible"}, {"time": "02:43:46,479 --> 02:43:57,840", "en": "but my distress being favorable to her views only stiffened her the more she told me very coolly that she was indeed sorry for my misfortunes but that"}, {"time": "02:43:57,840 --> 02:44:04,080", "en": "she must do herself justice though it would go to the very heart of her to send such a tender young creature"}, {"time": "02:44:04,080 --> 02:44:11,040", "en": "to prison at the word prison every drop of my blood chilled and my fright acted so"}, {"time": "02:44:11,040 --> 02:44:17,040", "en": "strongly upon me that turning as pale and faint as a criminal at the first sight of his place"}, {"time": "02:44:17,040 --> 02:44:25,920", "en": "of execution i was on the point of swooning my landlady who wanted only to terrify me to a certain point and not to throw"}, {"time": "02:44:25,920 --> 02:44:34,240", "en": "me into a state of body inconsistent with her designs upon it began to soothe me again and told me in a tone composed"}, {"time": "02:44:34,240 --> 02:44:41,279", "en": "to more pity and gentleness that it would be my own fault if she was forced to proceed to such extremities"}, {"time": "02:44:41,279 --> 02:44:45,359", "en": "but she believed there was a friend to be found in the world who would make up"}, {"time": "02:44:45,359 --> 02:44:51,920", "en": "matters to both our satisfactions and that she would bring him to drink tea with us that very afternoon"}, {"time": "02:44:51,920 --> 02:44:59,200", "en": "when she hoped we would come to a right understanding in our affairs to all this not a word of answer i sat"}, {"time": "02:44:59,200 --> 02:45:09,439", "en": "mute confounded terrified mrs jones however judging rightly that it was time to strike while the impressions were so strong upon me"}, {"time": "02:45:09,439 --> 02:45:16,720", "en": "left me to myself and to all the terrors of imagination wounded to death by the idea of going to a prison"}, {"time": "02:45:16,720 --> 02:45:29,600", "en": "and from a principle of self-preservation snatching at every glimpse of redemption from it in this situation i sat near half an hour swallowed up in grief and despair"}, {"time": "02:45:29,600 --> 02:45:37,680", "en": "when my landlady came in and observing a death-like dejection in my countenance and still in pursuance of her plan"}, {"time": "02:45:37,680 --> 02:45:46,479", "en": "put on a false pity and bidding me be of a good heart things she said would not be so bad as i imagined if i"}, {"time": "02:45:46,479 --> 02:45:53,040", "en": "would be but my own friend and closed with telling me that she had brought a very honorable gentleman to drink tea"}, {"time": "02:45:53,040 --> 02:45:58,319", "en": "with me who would give me the best advice how to get rid of all my troubles"}, {"time": "02:45:58,319 --> 02:46:06,640", "en": "upon which without waiting for a reply she goes out and returns with this very honorable gentleman whose very honorable"}, {"time": "02:46:06,640 --> 02:46:14,160", "en": "procureus she had been on this as well as other occasions this gentleman on his entering the room"}, {"time": "02:46:14,160 --> 02:46:25,359", "en": "made me a very civil bow which i had scarce strength or presence of mind enough to return a curtsy to when the landlady taking upon her to do"}, {"time": "02:46:25,359 --> 02:46:32,240", "en": "all the honors of the first interview for i had never that i remembered seeing the gentleman before"}, {"time": "02:46:32,240 --> 02:46:38,800", "en": "sets a chair for him and another for herself all this while not a word on either side"}, {"time": "02:46:38,800 --> 02:46:46,000", "en": "a stupid stare was all the face i could put on this strange visit the tea was made and the landlady"}, {"time": "02:46:46,000 --> 02:46:57,600", "en": "unwilling i suppose to lose any time observing my silence and shyness before this entire stranger come miss fanny says she in a course"}, {"time": "02:46:57,600 --> 02:47:05,920", "en": "familiar style and tone of authority hold up your head child and do not let sorrow spoil that pretty face of yours"}, {"time": "02:47:05,920 --> 02:47:12,319", "en": "what sorrows are only for a time come be free here is a worthy gentleman who has heard"}, {"time": "02:47:12,319 --> 02:47:22,800", "en": "of your misfortunes and is willing to serve you you must be better acquainted with him do you not now stand upon your pontillios and this and that but make"}, {"time": "02:47:22,800 --> 02:47:30,160", "en": "your market while you may at this so delicate and eloquent harangue the gentleman who saw i looked"}, {"time": "02:47:30,160 --> 02:47:41,760", "en": "frightened and amazed and indeed incapable of answering took her up for breaking things in so abrupt a manner as rather to shock than incline me to an acceptance of the good"}, {"time": "02:47:41,760 --> 02:47:52,080", "en": "he intended me then addressing himself to me told me he was perfectly acquainted with my whole story and every circumstance of my distress"}, {"time": "02:47:52,080 --> 02:47:59,600", "en": "which he owned was a cruel plunge for one of my youth and beauty to fall into that he had long taken a liking to my"}, {"time": "02:47:59,600 --> 02:48:08,560", "en": "person for which he appealed to mrs jones their present but finding me so absolutely engaged to another he had lost all hopes"}, {"time": "02:48:08,560 --> 02:48:16,800", "en": "of succeeding till he had heard the sudden reverse of fortune that had happened to me on which he had given particular orders"}, {"time": "02:48:16,800 --> 02:48:21,920", "en": "to my landlady to see that i should want for nothing and that had he not been"}, {"time": "02:48:21,920 --> 02:48:32,000", "en": "forced abroad to the hague on affairs he could not refuse himself to he would himself have attended me during my sickness that on his return which was"}, {"time": "02:48:32,000 --> 02:48:39,120", "en": "but the day before he had on learning my recovery desired my landlady's good offices to introduce"}, {"time": "02:48:39,120 --> 02:48:46,880", "en": "him to me and was as angry at least as i was shocked at the manner in which she had conducted herself towards obtaining"}, {"time": "02:48:46,880 --> 02:48:58,240", "en": "him that happiness but that to show me how much he disdained her procedure and how far he was from taking any and generous advantage of my situation and"}, {"time": "02:48:58,240 --> 02:49:09,920", "en": "from exacting any security for my gratitude he would before my face that instant discharge my debt entirely to my landlady and give me her receipt in full"}, {"time": "02:49:09,920 --> 02:49:19,120", "en": "after which i should be at liberty either to reject or grant his suit as he was much above putting any force upon my inclinations"}, {"time": "02:49:19,120 --> 02:49:29,439", "en": "whilst he was exposing his sentiments to me i ventured just to look up to him and observing his figure which was that of a very well looking gentleman"}, {"time": "02:49:29,439 --> 02:49:40,160", "en": "well-made about 40 dressed in a suit of plain clothes with a large diamond ring on one of his fingers the luster of which played in my eyes as he waved his"}, {"time": "02:49:40,160 --> 02:49:51,840", "en": "hand in talking and raised my notions of his importance in short he might pass for what is commonly called a comely black man with an air of distinction natural to his"}, {"time": "02:49:51,840 --> 02:50:01,680", "en": "birth and condition to all his speeches however i answered only in tears that flowed plentifully to my relief and choking up my voice"}, {"time": "02:50:01,680 --> 02:50:12,880", "en": "excused me from speaking very luckily for i should not have known what to say the sight however moved him as he afterwards told me irresistibly and by"}, {"time": "02:50:12,880 --> 02:50:22,800", "en": "way of giving me some reason to be less powerfully afflicted he drew out his purse and calling for pen and ink which the landlady was prepared for"}, {"time": "02:50:22,800 --> 02:50:33,760", "en": "paid her every farthing of her demand independent of a liberal gratification which was to follow unknown to me and taking a receipt in full very tenderly"}, {"time": "02:50:33,760 --> 02:50:42,880", "en": "forced me to secure it by guiding my hand which he had trusted into so as to make me passively put it into my pocket"}, {"time": "02:50:42,880 --> 02:50:52,240", "en": "still i continued in a state of stupidity or melancholy despair as my spirits could not yet recover from the violent shocks they had received"}, {"time": "02:50:52,240 --> 02:50:58,880", "en": "and the commode land lady had actually left the room and me alone with this strange gentleman"}, {"time": "02:50:58,880 --> 02:51:07,680", "en": "before i observed it and then i observed it without alarm for i was now lifeless and indifferent to everything"}, {"time": "02:51:07,680 --> 02:51:15,760", "en": "the gentleman however no novice in affairs of this sort drew near me and under the pretense of comforting me"}, {"time": "02:51:15,760 --> 02:51:26,960", "en": "first with his handkerchief dried my tears as they ran down my cheeks presently he ventured to kiss me on my part neither resistance nor compliance i"}, {"time": "02:51:26,960 --> 02:51:34,960", "en": "sat stuck still and now looking on myself as bought by the payment that had been transacted before me i did not care"}, {"time": "02:51:34,960 --> 02:51:46,640", "en": "what became of my wretched body and wanting life spirits or courage to oppose the least struggle even that of the modesty of my sex i suffered tamely"}, {"time": "02:51:46,640 --> 02:51:57,040", "en": "whatever the gentleman pleased who proceeding insensibly from freedom to freedom insinuated his hand between my handkerchief and bosom which he handled"}, {"time": "02:51:57,040 --> 02:52:08,560", "en": "at discretion finding thus no repulse and that everything favored beyond expectation the completion of his desires he took me in his arms and bore"}, {"time": "02:52:08,560 --> 02:52:20,479", "en": "me without life or motion to the bed on which laying me gently down and having me at what advantage he pleased i did not so much as know what he was about"}, {"time": "02:52:20,479 --> 02:52:31,439", "en": "till recovering from a trance of lifeless insensibility i found him buried in me while lay passive and innocent of the least sensation of pleasure"}, {"time": "02:52:31,439 --> 02:52:41,279", "en": "a death cold corpse could scarce have less life or sense in it as soon as he had thus pacified a passion which had too little respected"}, {"time": "02:52:41,279 --> 02:52:49,520", "en": "the condition i was in he got off and after recomposing the disorder of my clothes employed himself with the utmost"}, {"time": "02:52:49,520 --> 02:52:58,160", "en": "tenderness to calm the transports of remorse and madness at myself with which i was seized too late i confess"}, {"time": "02:52:58,160 --> 02:53:06,160", "en": "for having suffered on that bed the embraces of an utter stranger i tore my hair wrung my hands and beat"}, {"time": "02:53:06,160 --> 02:53:16,640", "en": "my breast like a mad woman but when my new master for in that light i then viewed him applied himself to appease me as my whole rage was leveled"}, {"time": "02:53:16,640 --> 02:53:24,880", "en": "at myself no part of which i thought myself permitted to aim at him i begged of him with more submission than anger"}, {"time": "02:53:24,880 --> 02:53:36,080", "en": "to leave me alone that i might at least enjoy my affliction in quiet this he positively refused for fear as he pretended i should do myself a"}, {"time": "02:53:36,080 --> 02:53:49,680", "en": "mischief violent passions seldom last long and those of women least of any a dead still calm succeeded this storm which ended in a profuse shower of tears"}, {"time": "02:53:49,680 --> 02:53:58,160", "en": "had anyone but a few instants before told me that i should have ever known any man but charles i would have spit in his face"}, {"time": "02:53:58,160 --> 02:54:03,520", "en": "or had i been offered infinitely a greater sum of money than that i saw paid for me"}, {"time": "02:54:03,520 --> 02:54:11,279", "en": "i had spurned the proposal in cold blood but our virtues and vices depend too much on our circumstances"}, {"time": "02:54:11,279 --> 02:54:20,240", "en": "unexpectedly beset as i was betrayed by a mind weakened by a long severe affliction and stunned with the terrors of a jail"}, {"time": "02:54:20,240 --> 02:54:28,479", "en": "my defeat will appear the more excusable since i certainly was not present at or a party in any sense to it"}, {"time": "02:54:28,479 --> 02:54:38,560", "en": "however as the first enjoyment is decisive and he was now over the bar i thought i had no longer a right to refuse the caresses of one that had got"}, {"time": "02:54:38,560 --> 02:54:49,840", "en": "that advantage over me no matter how obtained conforming myself then to this maxim i considered myself as so much in his power that i endured his kisses and"}, {"time": "02:54:49,840 --> 02:54:58,000", "en": "embraces without affecting struggles or anger not that they as yet gave me any pleasure or prevailed over the aversion"}, {"time": "02:54:58,000 --> 02:55:08,800", "en": "of my soul to give myself up to any sensation of that sort what i suffered i suffered out of a kind of gratitude and as a matter of course after what had"}, {"time": "02:55:08,800 --> 02:55:21,040", "en": "passed he was however so regardful as not to attempt the renewal of those extremities which had thrown me just before into such violent agitations but now secure"}, {"time": "02:55:21,040 --> 02:55:28,240", "en": "of possession contented himself with bringing me to temper by degrees and waiting at the hand of time"}, {"time": "02:55:28,240 --> 02:55:35,600", "en": "for those fruits of generosity and courtship which he since often reproached himself with having gathered much too green"}, {"time": "02:55:35,600 --> 02:55:46,560", "en": "when yielding to the invitations of my inability to resist him and overborne by desires he had wreaked his passion on a mere lifeless spiritless body dead to"}, {"time": "02:55:46,560 --> 02:55:57,040", "en": "all purposes of joy since taking none it ought to be supposed incapable of giving any this is however certain my heart never"}, {"time": "02:55:57,040 --> 02:56:03,760", "en": "thoroughly forgave him the manner in which i had fallen to him although in point of interest i had reason to be"}, {"time": "02:56:03,760 --> 02:56:11,200", "en": "pleased that he found in my person wherewithal to keep him from leaving me as easily as he had gained me"}, {"time": "02:56:11,200 --> 02:56:19,200", "en": "the evening was in the meantime so far advanced that the maid came in to lay the cloth for supper when i understood"}, {"time": "02:56:19,200 --> 02:56:27,680", "en": "with joy that my landlady whose sight was present poison to me was not to be with us presently a neat and elegant"}, {"time": "02:56:27,680 --> 02:56:34,640", "en": "supper was introduced and a bottle of burgundy with the other necessaries were set on a dumb waiter"}, {"time": "02:56:34,640 --> 02:56:44,800", "en": "the maid quitting the room the gentleman insisted with a tender warmth that i should sit up in the elbow chair by the fire and see him eat if i could not be"}, {"time": "02:56:44,800 --> 02:56:52,160", "en": "prevailed on to eat myself i obeyed with a heart full of affliction at the comparison it made between those"}, {"time": "02:56:52,160 --> 02:57:01,120", "en": "delicious tet attacks with my ever dear youth in this forced situation this new awkward scene imposed and obtruded on me"}, {"time": "02:57:01,120 --> 02:57:11,760", "en": "by cruel necessity at supper after a great many arguments used to comfort and reconcile me to my fate he told me that his name was h"}, {"time": "02:57:11,760 --> 02:57:19,439", "en": "brother to the earl of l and that having by the suggestions of my landlady been led to see me he had found"}, {"time": "02:57:19,439 --> 02:57:29,359", "en": "me perfectly to his taste and given her a commission to procure me at any rate and that he had at length succeeded as much to his satisfaction as he"}, {"time": "02:57:29,359 --> 02:57:36,319", "en": "passionately wished it might be to mine adding with all some flattering assurances that i should have no cause"}, {"time": "02:57:36,319 --> 02:57:46,800", "en": "to repent my knowledge of him i had now got down at least half a partridge and three or four glasses of wine which he compelled me to drink by"}, {"time": "02:57:46,800 --> 02:57:54,080", "en": "way of restoring nature but whether there was anything extraordinary put into the wine or whether there wanted no"}, {"time": "02:57:54,080 --> 02:58:04,800", "en": "more to revive the natural warmth of my constitution and give fire to the old train i began no longer to look with that constraint not to say disgust on mr"}, {"time": "02:58:04,800 --> 02:58:15,600", "en": "h which i had hith hereto done but with all there was not the least grain of love mixed with this softening of my sentiments any other man would have been"}, {"time": "02:58:15,600 --> 02:58:24,319", "en": "just the same to me as mr rage that stood in the same circumstances and had done for me and with me what he had done"}, {"time": "02:58:24,319 --> 02:58:33,600", "en": "there are not on earth at least eternal griefs mine were if not at an end at least suspended my heart which had been"}, {"time": "02:58 whom their youth and personal charms recommended to her adoption and management several of whom by her means and through her tuition and"}, {"time": "04:19:15,439 --> 04:19:27,359", "en": "instructions succeeded very well in the world this useful gentle woman upon whose protection i now threw myself having her reasons of state respecting mr h for not"}, {"time": "04:19:27,359 --> 04:19:34,479", "en": "appearing too much in the thing herself sent a friend of hers on the day appointed for my removal to conduct me"}, {"time": "04:19:34,479 --> 04:19:45,120", "en": "to my new lodgings at the brush makers in our street covent garden the very next door to her own house where she had no conveniences to lodge me herself"}, {"time": "04:19:45,120 --> 04:19:56,720", "en": "lodgings that by having been for several successions tenanted by ladies of pleasure the landlord of them was familiarized to their ways and provided the rent was"}, {"time": "04:19:56,720 --> 04:20:08,319", "en": "julie paid everything else was as easy and commodious as one could desire the 50 guineas promised me by mr h at his parting with me having been julie"}, {"time": "04:20:08,319 --> 04:20:19,760", "en": "paid me all my clothes and movables chested up which were at least of 200 pounds value i had them conveyed into a coach where i soon followed them after"}, {"time": "04:20:19,760 --> 04:20:30,319", "en": "taking a civil leave of the landlord and his family with whom i had never lived in a degree of familiarity enough to regret the removal but still the very"}, {"time": "04:20:30,319 --> 04:20:38,479", "en": "circumstance of its being a removal drew tears from me i left too a letter of thanks for mr h"}, {"time": "04:20:38,479 --> 04:20:47,680", "en": "from whom i concluded myself as i really was irretrievably separated my maid i had discharged the day before"}, {"time": "04:20:47,680 --> 04:20:53,040", "en": "not only because i had her of mr h but that i suspected her of having somehow"}, {"time": " o comply"}, {"time": "04:29:43,359 --> 04:29:51,120", "en": "with the rules of it thus had she insensibly formed a little family of love in which the members found so sensibly"}, {"time": "04:29:51,120 --> 04:29:58,880", "en": "their account in a rare alliance of pleasure with interest and of a necessary outward decency with unbounded"}, {"time": "04:29:58,880 --> 04:30:08,560", "en": "secret liberty that mrs cole who had picked them as much for their temper as her beauty governed them with ease to herself and them too"}, {"time": "04:30:08,560 --> 04:30:14,800", "en": "to these pupils then of hers whom she had prepared she presented me as a new border"}, {"time": "04:30:14,800 --> 04:30:22,640", "en": "and one that was to be immediately admitted to all the intimacies of the house upon which these charming girls gave me"}, {"time": "04:30:22,640 --> 04:30:30,319", "en": "all the marks of a welcome reception and indeed of being perfectly pleased with my figure that i could possibly expect"}, {"time": "04:30:30,319 --> 04:30:40,720", "en": "from any of my own sex bethe had been effectually brought to sacrifice all jealousy or competition of charms to a common interest and considered me a"}, {"time": "04:30:40,720 --> 04:30:48,319", "en": "partner that was bringing no despicable stock of goods into the trade of the house they gathered round me viewed me on all"}, {"time": "04:30:48,319 --> 04:30:57,120", "en": "sides and as my admission into this joyous troop made the little holiday the show of work was laid aside and mrs cole"}, {"time": "04:30:57,120 --> 04:31:05,120", "en": "giving me up with special recommendation to their caresses and entertainment went about her ordinary business of the house"}, {"time": "04:31:05,120 --> 04:31:14,000", "en": "the sameness of our sex age profession and views soon created as unreserved a freedom and intimacy as if we had been"}, {"time": "04:31:14,000 --> 04:31:24,560", "en": "for years acquainted they took and showed me the house
